[package]
name = "clementine"
version = "0.1.0"
edition = "2024"
description = "Offline drag-and-drop file converter for Linux"
# TODO: license. The owner has not picked a license yet.

[dependencies]
anyhow = "1.0.104"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2.191"
tempfile = "3.27.0"

[package.metadata.deb]
name = "clementine"
maintainer = "Sphanx <98588426+Sphanx@users.noreply.github.com>"
copyright = "2026, Sphanx"
# TODO: license-file / license. The owner has not picked a license yet.
section = "utils"
priority = "optional"
extended-description = """\
Clementine converts files without uploading them anywhere. Drag a file onto the window, \
hold a modifier key, and drop it on a format on the conversion wheel. Conversions run \
through ffmpeg, ImageMagick, pandoc, LibreOffice, poppler and the archive tools already \
on your computer."""
depends = "$auto, libgtk-4-1 (>= 4.14)"
recommends = "ffmpeg, imagemagick, pandoc, poppler-utils, zip, unzip"
suggests = "libreoffice-core, unrar, p7zip-full, ghostscript, qpdf"
assets = [
    ["target/release/clementine", "usr/bin/", "755"],
    ["data/io.github.sphanx.Clementine.desktop", "usr/share/applications/", "644"],
    ["data/io.github.sphanx.Clementine.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/icons/hicolor/scalable/apps/io.github.sphanx.Clementine.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/icons/hicolor/symbolic/apps/io.github.sphanx.Clementine-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
]
